[task]
name = "demo_posts"
plugin = "demo"
dataset = "posts"

[task.parameters]
base_url = "https://jsonplaceholder.typicode.com/posts"
page_size = 20
max_pages = 10
schema_version = "1"

[transport]
mode = "http"
timeout = 30
max_response_bytes = 10485760

[retry]
attempts = 3
base_delay = 0.5
max_delay = 5
jitter = 0.1

[pipeline]
required_fields = ["id", "title"]
dedupe_keys = ["id"]

[checkpoint]
enabled = true
directory = "checkpoints"
resume = true
clear_on_success = true

[[outputs]]
type = "json"
path = "output/demo/posts.json"

